openapi: 3.1.0
info:
  title: May Flower Admin API
  version: 0.2.0
  description: Staff JWT API for orders, catalog, inventory, support, and AI copilot.
servers:
  - url: http://localhost:3101/v1/admin
paths:
  /auth/login:
    post:
      summary: Staff login
      responses:
        "200":
          description: access + refresh tokens
  /auth/refresh:
    post:
      summary: Refresh access token
  /me:
    get:
      summary: Current staff profile
  /dashboard:
    get:
      summary: Operations dashboard KPIs and alerts
  /orders:
    get:
      summary: Order inbox
  /orders/{id}:
    get:
      summary: Order detail
  /orders/{id}/status:
    patch:
      summary: Transition order status (audited)
  /custom-order-requests/{id}/convert:
    post:
      summary: Convert approved AI request to order
  /customers:
    get:
      summary: Customer directory
  /customers/{id}:
    get:
      summary: Customer profile with history
  /flowers:
    get:
      summary: Flower catalog
    post:
      summary: Create flower
  /flowers/{id}:
    get:
      summary: Flower detail
    patch:
      summary: Update flower
  /addons:
    get:
      summary: Add-on catalog
    post:
      summary: Create add-on
  /addons/{id}:
    get:
      summary: Add-on detail
    patch:
      summary: Update add-on
  /products:
    get:
      summary: Products with variants and ATP
  /inventory/low-stock:
    get:
      summary: Variants with available quantity ≤ 3
  /variants/{id}/stock:
    patch:
      summary: Adjust variant ATP (ledger movement + audit)
  /support/sessions:
    get:
      summary: Customer AI chat sessions
  /support/sessions/{id}:
    get:
      summary: Session transcript
  /assistant/stats:
    get:
      summary: KPI strip for copilot UI
  /assistant/chat:
    post:
      summary: Staff copilot (OpenAI tools + DB fallback)
