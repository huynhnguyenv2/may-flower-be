name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"try{rs.status()}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})}\""
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10

    env:
      DATABASE_URL: mongodb://localhost:27017/mayflower_test?replicaSet=rs0
      PAYMENT_MODE: dev_skip

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @may-flower/shared build

      - name: Prisma db push
        run: pnpm --filter @may-flower/api exec prisma db push

      - run: pnpm db:seed

      - run: pnpm --filter @may-flower/api test

      - name: OpenAPI file present
        run: test -f openapi/public-v1.yaml
